[project]
name = "yt-mcp"
version = "0.1.0"
description = "Local-pipeline MCP server for YouTube video analysis (transcript, frames, audio, unified timeline) — no API keys required"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.0.0",
    "yt-dlp>=2024.1.1",
    "openai-whisper>=20231117",
    # torch is whisper's heavy runtime dependency. It is declared directly (not
    # left transitive) so the CPU-index source mapping in [tool.uv.sources] below
    # takes effect — uv only honors sources for the project's *direct* deps.
    "torch>=2.0.0",
    "librosa>=0.10.0",
    "numpy>=1.24.0",
    "soundfile>=0.12.0",
    "scipy>=1.11.0",
    "scenedetect>=0.6.0",
    "opencv-python>=4.8.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.12.0",
]

# This project is run as a script (`python server/main.py`), not installed as a
# distributable package. Marking it non-package tells uv to manage the virtual
# environment and dependencies without trying to build/install the repo itself.
[tool.uv]
package = false

# --- torch wheel source ------------------------------------------------------
# DESIGN DECISION (issue #1 — Docker deployment): source torch from the CPU-only
# PyTorch wheel index on Linux.
#
# Whisper transcription runs on CPU by default (model="base"). The stock torch
# wheel on PyPI declares the entire NVIDIA CUDA stack as Linux dependencies
# (cuDNN, cuBLAS, NCCL, cuFFT, … ≈ 3 GB compressed), which would push the
# container to ~6 GB with libraries that never execute on a CPU host. Pulling
# torch from the CPU index drops all of them, keeping the deployable image at
# ~2.8 GB and runnable anywhere.
#
# The `sys_platform == 'linux'` marker scopes this to Linux only — macOS keeps
# resolving torch from PyPI (already CPU/MPS there), so local dev on a Mac is
# unaffected. To build a GPU-accelerated image instead, drop this source mapping,
# re-lock, and build on a CUDA base image. See docs/deployment.md.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
